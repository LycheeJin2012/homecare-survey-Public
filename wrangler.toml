name = "yingti-tech"
compatibility_date = "2024-09-01"
# 不要设 pages_build_output_dir：CF Pages 在 GitHub 构建时读本文件，
# 显式指定输出目录会只发布该目录，导致仓库根的 functions/ 被排除，
# /api/* 全部 404、Functions 读不到 env var。留空让 CF 自动识别 public/ + functions/。

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "homecare-survey-db"
database_id = "eb4a62f0-a2ae-49ab-b2b9-2c268dda5c40"

# env vars 不放这里，必须在 CF Dashboard → Settings → Variables and Secrets 配置
# （Pages Functions runtime 不从 wrangler.toml [vars] 读取）
