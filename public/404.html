<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面未找到 · 404 | 居家护理服务质量调研</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>" />
  <link rel="stylesheet" href="/css/home.css" />
  <style>
    body { background: #f8fafc; }
    .err-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .err-card {
      max-width: 480px; text-align: center;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 48px 32px; box-shadow: 0 8px 24px rgba(15,23,42,0.06);
    }
    .err-code { font-size: 96px; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; margin: 0 0 12px;
    }
    .err-title { font-size: 22px; color: #0f172a; margin: 0 0 8px; font-weight: 600; }
    .err-desc { color: #6b7280; font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
    .err-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .err-actions a { display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 500;
      text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
    .err-actions a.primary { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.18); }
    .err-actions a.primary:hover { transform: translateY(-1px); }
    .err-actions a.ghost { background: #fff; color: #4b5563; border: 1px solid #e5e7eb; }
    .err-actions a.ghost:hover { border-color: #2563eb; color: #2563eb; }
    .err-emoji { font-size: 64px; line-height: 1; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="err-page">
    <div class="err-card">
      <div class="err-emoji">🔍</div>
      <h1 class="err-code">404</h1>
      <h2 class="err-title">页面未找到</h2>
      <p class="err-desc">您访问的页面不存在或链接已过期。<br/>请检查 URL 是否正确，或返回首页继续浏览。</p>
      <div class="err-actions">
        <a href="/" class="primary">← 返回首页</a>
        <a href="/survey" class="ghost">填写问卷</a>
      </div>
    </div>
  </div>
</body>
</html>
